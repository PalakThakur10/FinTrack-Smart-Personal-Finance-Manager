<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — FINTRACK Finance System</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.12) 0%, rgba(11, 15, 25, 1) 70%);
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 36px;
      box-shadow: var(--shadow-lg);
    }
    .auth-logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo-row">
        <div style="width: 44px; height: 44px; background: var(--accent-gradient); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.3rem; color: #ffffff;">
          FT
        </div>
        <div>
          <h2 style="font-size: 1.35rem; font-weight: 800; color: #ffffff;">FINTRACK</h2>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Smart Personal Finance System</div>
        </div>
      </div>

      <h1 style="font-size: 1.5rem; font-weight: 700; color: #ffffff; margin-bottom: 6px;">Create Account</h1>
      <p class="text-secondary" style="font-size: 0.88rem; margin-bottom: 24px;">Start managing your personal cashflow with complete privacy.</p>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="e.g. John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 characters)</label>
          <input type="password" id="password" class="form-control" placeholder="Choose a secure password" minlength="6" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" minlength="6" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">
          Register Account
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 0.85rem;" class="text-secondary">
        Already have an account? <a href="login.html" style="color: var(--accent-primary); font-weight: 600;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      FinTrackAuth.checkAuth(false);

      const form = document.getElementById('registerForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
          FinTrackAPI.showToast('Passwords do not match.', 'error');
          return;
        }

        await FinTrackAuth.register(name, email, password, confirmPassword);
      });
    });
  </script>
</body>
</html>
